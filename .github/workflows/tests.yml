name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per plugin under plugins/. Add a new plugin's directory
        # name here to bring it into CI.
        plugin: [chiplet_export]
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: plugins/${{ matrix.plugin }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest psutil

      # pcbnew (KiCad Python) is not available on the runner; tests that need
      # it skip via importorskip. Tests that need sibling ecosystem checkouts
      # (interconnect PDK, interposer PDK) skip via their module guards.
      - name: Run tests
        run: pytest tests -q
