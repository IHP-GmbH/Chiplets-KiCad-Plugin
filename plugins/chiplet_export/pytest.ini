[pytest]
# -ra prints the reason for every skipped test. This suite skips harder than any
# other in the ecosystem: without pcbnew, a KLayout module, an interposer .lyp
# and four sibling checkouts, roughly half of it disappears and the run finishes
# in seconds looking green. Those skips are honest on a bare runner, but a
# passed count cannot distinguish them from a suite that shrank.
#
# --strict-markers and --strict-config turn a typo in a marker or an ini key
# into an error instead of a silently ignored line.
addopts = -ra --strict-markers --strict-config
testpaths = tests
